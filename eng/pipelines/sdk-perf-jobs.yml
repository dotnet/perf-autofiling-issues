  # Maui Android scenario benchmarks (CoreCLR JIT) - DEBUG (NEW)
  - template: /eng/pipelines/templates/build-machine-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/templates/run-scenarios-job.yml
      buildMachines:
        - win-x64-android-arm64-pixel
